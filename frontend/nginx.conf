# SPA fallback (try_files ... /index.html) is required because this is a
# client-side-routed React Router app: without it, a direct visit or a
# page refresh on e.g. /dashboard would 404 at the nginx level, since no
# literal file exists at that path -- only index.html + client-side JS
# knows how to render it. Listening on 5173 to match docker-compose.yml's
# `expose: "5173"` and the Caddyfile's `reverse_proxy frontend:5173` --
# an internal port choice, not meaningful outside this compose network.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself must
    # never be cached, or a redeploy wouldn't be visible until a hard
    # refresh clears a stale cached index.html referencing old asset hashes.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
